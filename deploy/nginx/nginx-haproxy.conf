worker_processes auto;
user        root;
pid         /shared/sockets/nginx.pid;
error_log   /var/log/nginx/error.log;

events {
  worker_connections 1024;
  accept_mutex off;
}

http {
  # Canonical lowercase UUIDv4 only. Empty means missing/invalid/duplicate.
  map $http_x_request_id $edge_request_id {
    default "";
    "~^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" $http_x_request_id;
  }
  # Upstream fields are strings: empty/'-' when absent, lists on retries/redirects.
  # Times are seconds; request_length includes request line, headers and body.
  log_format request_metadata escape=json
    '{"layer":"nginx","request_id":"$edge_request_id",'
    '"status":$status,"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"upstream_status":"$upstream_status","request_length":$request_length}';

  include mime.types;
  default_type application/octet-stream;
  sendfile on;
  gzip_static on;
  keepalive_timeout 65;

# set real ip to internal LB subnet
  set_real_ip_from 192.168.71.0/24;

# use proxy_protocol for real_ip_header,
# https://docs.nginx.com/nginx/admin-guide/load-balancer/using-proxy-protocol/
  real_ip_header      proxy_protocol;

  upstream app_server {
    server unix:/shared/sockets/uwsgi.sock fail_timeout=0;
  }

  server {
    listen      80  proxy_protocol;
    server_name www.comses.net;
    root /srv;
    client_max_body_size    100M;
    location / {
# check for static files first, otherwise proxy to app
      try_files $uri /static/favicon/$uri @proxy_to_app;
    }
    location /library/internal {
      internal;
      alias /library;
    }
    location @proxy_to_app {
      include             /etc/nginx/uwsgi_params;
      uwsgi_pass_request_headers on;
      # Override auto-forwarding for this header: exactly one validated value.
      uwsgi_param HTTP_X_REQUEST_ID $edge_request_id;
      uwsgi_pass          app_server;
    }
    access_log /var/log/nginx/request-metadata.jsonl request_metadata;
    error_log /var/log/nginx/error.log;
  }
}
