services:
  db:
    restart: always
  redis:
    restart: always
  elasticsearch:
    restart: always
    environment:
      - cluster.name=es-docker-cluster
      - discovery.seed_hosts=es02
      - cluster.initial_master_nodes=elasticsearch,es02
    volumes:
      - type: bind
        source: ${COMSES_SHARED_ROOT:-./docker/shared}/elasticsearch/v9/primary
        target: /usr/share/elasticsearch/data
        bind:
          create_host_path: false
  # FIXME: duplication bad
  es02:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION}
    restart: always
    networks:
      - search
    environment:
      - node.name=es02
      - cluster.name=es-docker-cluster
      - discovery.seed_hosts=elasticsearch
      - cluster.initial_master_nodes=elasticsearch,es02
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - xpack.security.autoconfiguration.enabled=false
      - "ES_JAVA_OPTS=-Xms768m -Xmx768m"
    mem_limit: 2g
    mem_reservation: 1g
    memswap_limit: 2g
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - type: bind
        source: ${COMSES_APP_ROOT:-.}/deploy/elasticsearch.conf.d/log4j2.properties
        target: /usr/share/elasticsearch/config/log4j2.properties
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${COMSES_SHARED_ROOT:-./docker/shared}/elasticsearch/v9/secondary
        target: /usr/share/elasticsearch/data
        bind:
          create_host_path: false
  vite:
    build:
      context: ./frontend
      target: build
    image: comses/vite:${RELEASE_VERSION}
    command: ["npm", "run", "build"]
    environment:
      NODE_ENV: "production"
  nginx:
    image: nginx:stable
    restart: always
    volumes:
      - type: bind
        source: ${COMSES_APP_ROOT:-.}/deploy/nginx/nginx-staging.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${COMSES_APP_ROOT:-.}/deploy/nginx/uwsgi_params
        target: /etc/nginx/uwsgi_params
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${COMSES_SHARED_ROOT:-./docker/shared}/tls/well-known
        target: /srv/.well-known
        bind:
          create_host_path: false
      - type: bind
        source: ${COMSES_LOG_ROOT:-./docker/shared/logs}/nginx
        target: /var/log/nginx
        bind:
          create_host_path: false
      - type: bind
        source: ${COMSES_SHARED_ROOT:-./docker/shared}/static
        target: /srv/static
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${COMSES_SHARED_ROOT:-./docker/shared}/media
        target: /srv/media
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${COMSES_SHARED_ROOT:-./docker/shared}/library
        target: /library
        read_only: true
        bind:
          create_host_path: false
      - sockets:/shared/sockets
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "80:80"
    depends_on:
      - server
  server:
    build:
      context: ./django
      args:
        REQUIREMENTS_FILE: requirements-dev.txt
        UBUNTU_MIRROR: "mirror.it.ubc.ca"
        RUN_SCRIPT: "./deploy/prod.sh"
    image: comses/server:${RELEASE_VERSION}
    restart: always
    volumes:
      - sockets:/shared/sockets
    environment:
      DJANGO_SETTINGS_MODULE: "core.settings.staging"
    ports:
      - "127.0.0.1:9191:9191" # uWSGI stats server
    depends_on:
      vite:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
volumes:
  sockets:
    driver: local
