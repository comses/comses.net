[project]
name = "comsesnet-tooling"
version = "0"
requires-python = ">=3.12"

[tool.uv]
package = false

[dependency-groups]
dev = [
  "ruff>=0.16",
  "pytest",
  "pre-commit",
]

[tool.ruff]
# Shared by make format and the VS Code workspace settings.
line-length = 120
target-version = "py312"
extend-exclude = ["**/migrations/**", "**/fixtures/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
