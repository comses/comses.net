[uwsgi]
# 64 web request threads within PostgreSQL's 100-connection budget.
# Reserve remaining capacity for Huey, maintenance and administration.
# Load after uwsgi.ini. Do not raise without reviewing database capacity.
processes = 16
threads = 4
cheaper = 4
cheaper-initial = 4
cheaper-step = 2
cheaper-busyness-backlog-step = 1
