name: Django CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run_tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEPLOY_ENVIRONMENT: test
      DOCKER_BUILD_FLAGS: --quiet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: run deployment contract tests
        run: make test-deploy-contracts
      - name: run deployment storage tests
        run: make test-storage-scripts
      - name: build containers and run Django tests
        run: make test
