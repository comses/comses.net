services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "-e", "-s", "/data/redis.sock", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
      - type: bind
        source: ${COMSES_APP_ROOT:-.}/deploy/conf/redis.conf
        target: /usr/local/etc/redis/redis.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${COMSES_SHARED_ROOT:-./docker/shared}/redis
        target: /data
        bind:
          create_host_path: false
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION}
    healthcheck:
      test: curl -u elastic:elastic -s -f elasticsearch:9200/_cat/health >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      - node.name=elasticsearch
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    deploy:
      resources:
        limits:
          memory: 1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - type: bind
        source: ${COMSES_APP_ROOT:-.}/deploy/elasticsearch.conf.d/log4j2.properties
        target: /usr/share/elasticsearch/config/log4j2.properties
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${COMSES_SHARED_ROOT:-./docker/shared}/elasticsearch/primary
        target: /usr/share/elasticsearch/data
        bind:
          create_host_path: false
  db:
    image: postgis/postgis:16-3.5
    secrets:
      - db_password
    volumes:
      - type: bind
        source: ${COMSES_POSTGRES_ROOT:-./docker/pgdata}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
      - type: bind
        source: ${COMSES_SHARED_ROOT:-./docker/shared}
        target: /shared
        bind:
          create_host_path: false
      - type: bind
        source: ${COMSES_LOG_ROOT:-./docker/shared/logs}
        target: /shared/logs
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 30s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_DB: "${DB_NAME}"
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
  vite:
    build:
      context: ./frontend
      target: dev
    image: comses/vite
    volumes:
      - type: bind
        source: ${COMSES_SHARED_ROOT:-./docker/shared}
        target: /shared
        bind:
          create_host_path: false
  server:
    build: django
    image: comses/server
    secrets:
      - datacite_api_password
      - db_password
      - discourse_api_key
      - discourse_sso_secret
      - django_secret_key
      - download_analytics_hmac_key
      - github_client_secret
      - orcid_client_secret
      - github_integration_app_private_key
      - github_integration_app_webhook_secret
      - hcaptcha_secret
      - librarian_sso_secret
      - mail_api_key
      - youtube_api_key
      - borg_replication_ssh_key
      - borg_replication_known_hosts
    volumes:
      - type: bind
        source: ${COMSES_APP_ROOT:-.}/deploy/elasticsearch.conf.d
        target: /etc/elasticsearch
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${COMSES_SHARED_ROOT:-./docker/shared}
        target: /shared
        bind:
          create_host_path: false
      - type: bind
        source: ${COMSES_LOG_ROOT:-./docker/shared/logs}
        target: /shared/logs
        bind:
          create_host_path: false
      - type: bind
        source: ${COMSES_APP_ROOT:-.}/.env
        target: /etc/environment
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      vite:
        condition: service_started
    env_file:
      - ./.env

secrets:
  borg_replication_ssh_key:
    file: ${COMSES_SECRETS_ROOT:-./docker/secrets}/borg_replication_ssh_key
  borg_replication_known_hosts:
    file: ${COMSES_SECRETS_ROOT:-./docker/secrets}/borg_replication_known_hosts
  datacite_api_password:
    file: ${COMSES_SECRETS_ROOT:-./docker/secrets}/datacite_api_password
  db_password:
    file: ${COMSES_SECRETS_ROOT:-./docker/secrets}/db_password
  discourse_api_key:
    file: ${COMSES_SECRETS_ROOT:-./docker/secrets}/discourse_api_key
  discourse_sso_secret:
    file: ${COMSES_SECRETS_ROOT:-./docker/secrets}/discourse_sso_secret
  django_secret_key:
    file: ${COMSES_SECRETS_ROOT:-./docker/secrets}/django_secret_key
  download_analytics_hmac_key:
    file: ${COMSES_SECRETS_ROOT:-./docker/secrets}/download_analytics_hmac_key
  github_client_secret:
    file: ${COMSES_SECRETS_ROOT:-./docker/secrets}/github_client_secret
  github_integration_app_private_key:
    file: ${COMSES_SECRETS_ROOT:-./docker/secrets}/github_integration_app_private_key
  github_integration_app_webhook_secret:
    file: ${COMSES_SECRETS_ROOT:-./docker/secrets}/github_integration_app_webhook_secret
  hcaptcha_secret:
    file: ${COMSES_SECRETS_ROOT:-./docker/secrets}/hcaptcha_secret
  librarian_sso_secret:
    file: ${COMSES_SECRETS_ROOT:-./docker/secrets}/librarian_sso_secret
  mail_api_key:
    file: ${COMSES_SECRETS_ROOT:-./docker/secrets}/mail_api_key
  orcid_client_secret:
    file: ${COMSES_SECRETS_ROOT:-./docker/secrets}/orcid_client_secret
  youtube_api_key:
    file: ${COMSES_SECRETS_ROOT:-./docker/secrets}/youtube_api_key
